<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emergency Prompt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            background-color: #f8f8f8;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 500px;
            margin: auto;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .yes-btn {
            background-color: #ff4b4b;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .no-btn {
            background-color: #eee;
            color: black;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .info-section {
            display: flex;
            flex-direction: row;
            gap: 10px;
            margin-top: 20px;
            /* flex-wrap: wrap; */
        }

        .info-box {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            width: 48%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
        }

        #video {
            width: 100%;
            margin-top: 10px;
            border-radius: 10px;
            display: none;
        }

        .disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        a{
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Are you currently experiencing an emergency?</h2>
        <div class="buttons">
            <button id="yesBtn" class="yes-btn">🚨 Yes</button>
            <button id="noBtn" class="no-btn">No</button>
        </div>
        <div class="info-section">
            <div class="info-box" id="emergencyBox">
                <p class="title">Emergency</p>
                <p>📹 Live Video Support</p>
                <video id="video" autoplay playsinline muted></video>
            </div>
            <div class="info-box" id="normalBox">
                <a href="user.html">
                    <p class="title">Normal Incident</p>
                <p>💬 Chat and Upload Photos</p>
                </a>
            </div>
            <div class="info-box">
                <a href="report.html">
                    Şahid rəyi
                </a>
            </div>

        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const video = document.getElementById('video');
        const emergencyBox = document.getElementById('emergencyBox');
        const normalBox = document.getElementById('normalBox');

        yesBtn.addEventListener('click', async () => {
            emergencyBox.classList.remove('disabled');
            normalBox.classList.add('disabled');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.style.display = 'block';
            } catch (err) {
                alert('Camera access failed: ' + err.message);
            }
        });

        noBtn.addEventListener('click', () => {
            normalBox.classList.remove('disabled');
            emergencyBox.classList.add('disabled');
            video.style.display = 'none';
        });

    </script>
</body>

</html>
