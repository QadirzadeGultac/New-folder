<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Chat</title>
  <style>
    
    a{
      text-decoration: none;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 30px;
    }
    .chat-container {
      width: 90%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 90vh;
    }
    .chat-header {
      padding: 15px;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
      font-size: 30px;
    }
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .message {
      margin-bottom: 15px;
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 10px;
      position: relative;
      font-size: 35px;
    }
    .message.user {
      background: #f1f1f1;
      align-self: flex-start;
      color: #000;
    }
    .message.admin {
      background: #222;
      color: white;
      align-self: flex-end;
    }
    .timestamp {
      font-size: 25px;
      color: #888;
      margin-top: 4px;
    }
    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 10px;
    }
    .chat-input input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 30px;
      margin-right: 10px;
    }
    .chat-input button {
      background: black;
      color: white;
      border: none;
      padding: 10px 14px;
      font-size: 30px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header"><a href="admin.html">←</a>Admin Chat</div>
    <div class="chat-messages" id="adminMessages"></div>
    <div class="chat-input">
      <input type="text" id="adminInput" placeholder="Admin: Type a message...">
      <button onclick="sendFromAdmin()">Send</button>
    </div>
  </div>

  <script>
    function formatMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `message ${sender}`;
      div.innerHTML = `${text}<div class="timestamp">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>`;
      return div;
    }

    function sendFromAdmin() {
      const input = document.getElementById("adminInput");
      const text = input.value.trim();
      if (!text) return;

      const adminBox = document.getElementById("adminMessages");
      const message = formatMessage(text, "admin");
      adminBox.appendChild(message);
      input.value = "";
      adminBox.scrollTop = adminBox.scrollHeight;

      localStorage.setItem("chatMessage", JSON.stringify({ sender: "admin", text, timestamp: Date.now() }));
    }

    window.addEventListener("storage", (e) => {
      if (e.key === "chatMessage") {
        const msg = JSON.parse(e.newValue);
        if (msg.sender === "user") {
          const container = document.getElementById("adminMessages");
          const message = formatMessage(msg.text, msg.sender);
          container.appendChild(message);
          container.scrollTop = container.scrollHeight;
        }
      }
    });
  </script>
</body>
</html>
